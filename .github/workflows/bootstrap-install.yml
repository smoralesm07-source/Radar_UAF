name: Bootstrap Radar UAF

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruir, validar e instalar paquete
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/radar_uaf.b64.part* > /tmp/radar_uaf.b64
          base64 --decode /tmp/radar_uaf.b64 > /tmp/radar_uaf.tar.gz
          echo "7545203bb7b8f8bf41f5273c6eaf1702e7cfb7c3f88636a041f6ef3bcc292845  /tmp/radar_uaf.tar.gz" | sha256sum --check --strict

          rm -rf /tmp/radar_uaf_unpack
          mkdir -p /tmp/radar_uaf_unpack
          tar -xzf /tmp/radar_uaf.tar.gz -C /tmp/radar_uaf_unpack
          test -d /tmp/radar_uaf_unpack/Radar_UAF

          rsync -a --delete-excluded \
            --exclude='.git/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            /tmp/radar_uaf_unpack/Radar_UAF/ ./

          find . -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-install.yml

          git config user.name "radar-uaf-installer"
          git config user.email "radar-uaf-installer@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Instala Radar UAF v0.1"
          git push origin HEAD:main
