name: Validar Radar UAF v0.2

on:
  push:
    branches: [v0.2-fuentes-estadisticas]
    paths:
      - "radar_uaf/**"
      - "config/**"
      - "tests/**"
      - "docs/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/validate-v02.yml"

permissions:
  contents: write

concurrency:
  group: radar-uaf-v02-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.2-fuentes-estadisticas
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: pytest -q
      - name: Ejecutar pipeline v0.2 contra fuentes oficiales
        env:
          TZ: America/Santiago
        run: python run.py
      - name: Persistir resultados de validacion en la rama v0.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "radar-uaf-v02-bot"
          git config user.email "radar-uaf-v02-bot@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios de datos"
            exit 0
          fi
          git commit -m "v0.2: datos validados con fuentes oficiales"
          git push origin HEAD:v0.2-fuentes-estadisticas
